<!DOCTYPE html>
<html lang="{{HTML_LANG}}" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" type="image/png" href="{{ROOT}}assets/icon.png">
<link rel="alternate" hreflang="{{ALT_HREFLANG}}" href="{{ALT_HREF}}">
<script>
  try {
    var saved = localStorage.getItem('slate-docs-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}
</script>
<link rel="stylesheet" href="{{ROOT}}assets/docs.css">
</head>
<body {{BODY_ATTRS}} data-lang="{{LANG}}" data-root="{{ROOT}}" data-search-empty="{{T_NO_RESULT}}" data-search-docs="{{T_DOCS}}">

<a class="skip-link" href="#main">{{T_SKIP}}</a>

<header class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn menu-btn" type="button" data-menu aria-label="{{T_MENU}}" aria-expanded="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
    </button>

    <a class="brand" href="{{ROOT}}index.html">
      <img class="brand-logo" src="{{ROOT}}assets/icon.png" alt="">
      <span class="brand-name">SLATE</span>
      <span class="brand-sub">{{T_DOCS}}</span>
    </a>

    <button class="search-trigger" type="button" data-search-open>
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2 17 17"/></svg>
      <span>{{T_SEARCH}}</span>
      <kbd>Ctrl K</kbd>
    </button>

    <nav class="topbar-links">
      <a href="{{SITE_HOME}}" target="_blank" rel="noopener">{{T_HOME_SITE}}</a>
      <a href="{{SITE_GUIDE}}" target="_blank" rel="noopener">{{T_GUIDE}}</a>
      <a href="https://github.com/CaryWang1234/SLATE" target="_blank" rel="noopener">GitHub</a>
    </nav>

    <a class="lang-switch" href="{{ALT_HREF}}" hreflang="{{ALT_HREFLANG}}" title="{{ALT_TITLE}}">{{ALT_LABEL}}</a>

    <button class="icon-btn theme-btn" type="button" data-theme-toggle aria-label="{{T_THEME}}">
      <svg class="ico-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.3A6.6 6.6 0 0 1 7.7 4a6.8 6.8 0 1 0 8.3 8.3Z"/></svg>
      <svg class="ico-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 2v2.2M10 15.8V18M2 10h2.2M15.8 10H18M4.3 4.3l1.6 1.6M14.1 14.1l1.6 1.6M15.7 4.3l-1.6 1.6M5.9 14.1l-1.6 1.6"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <div class="scrim" data-scrim hidden></div>

  <aside class="sidebar" data-sidebar aria-label="{{T_NAV}}">
    <nav class="sidebar-nav">{{SIDEBAR}}</nav>
  </aside>

  <main class="main" id="main">
    <div class="main-inner">
      <nav class="breadcrumbs" aria-label="{{T_CRUMBS}}">{{BREADCRUMBS}}</nav>
      <article class="prose">{{CONTENT}}</article>
      <nav class="pager" aria-label="{{T_PAGER}}">{{PAGER}}</nav>
      <footer class="site-footer">
        <span>{{T_FOOTER}}</span>
        <span>
          <a href="{{SITE_HOME}}" target="_blank" rel="noopener">{{T_HOME_SITE}}</a> ·
          <a href="{{SITE_GUIDE}}" target="_blank" rel="noopener">{{T_GUIDE}}</a> ·
          <a href="https://github.com/CaryWang1234/SLATE" target="_blank" rel="noopener">GitHub</a>
        </span>
        <span>{{T_LICENSE}}</span>
      </footer>
    </div>
  </main>

  <aside class="toc" data-toc aria-label="{{T_TOC}}">{{TOC}}</aside>
</div>

<div class="search-overlay" data-search-overlay hidden>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="{{T_SEARCH}}">
    <div class="search-field">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2 17 17"/></svg>
      <input type="search" placeholder="{{T_SEARCH_HINT}}" data-search-input autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="search-results" data-search-results></div>
    <div class="search-hint"><span>{{T_KBD_MOVE}}</span><span>{{T_KBD_OPEN}}</span><span>{{T_KBD_CLOSE}}</span></div>
  </div>
</div>

<script src="{{ROOT}}assets/search-index.js"></script>
<script src="{{ROOT}}assets/docs.js"></script>
</body>
</html>
